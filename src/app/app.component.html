<div class="app-shell">
  <div class="client-login-backdrop" *ngIf="clientLoginOpen" (click)="closeClientLogin()">
    <div class="client-login-modal" (click)="$event.stopPropagation()">
      <p class="client-login-eyebrow">Entrar</p>
      <h2>Consultar pedidos</h2>
      <p class="client-login-lead">Informe seu nome e contato para acessar seus pedidos.</p>

      <form (ngSubmit)="submitClientLogin()">
        <label>
          <span>Nome</span>
          <input [(ngModel)]="loginNome" name="loginNome" type="text" placeholder="Seu nome" />
        </label>

        <label>
          <span>Contato</span>
          <input [(ngModel)]="loginContato" name="loginContato" type="text" placeholder="WhatsApp, Instagram ou TikTok" />
        </label>

        <p class="client-login-error" *ngIf="clientLoginError">{{ clientLoginError }}</p>

        <div class="client-login-actions">
          <button type="button" class="secondary-action" (click)="closeClientLogin()">Cancelar</button>
          <button type="submit" class="primary-action" [disabled]="clientLoginLoading">
            {{ clientLoginLoading ? 'Entrando...' : 'Entrar' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <header class="site-header" [class.admin-header]="isAdminRoute">
    <div class="brand-wrap">
      <a class="brand" routerLink="/">Maris e Laris</a>
      <span class="client-greeting" *ngIf="!isAdminRoute && clientNome">Ola {{ getClientDisplayName() }}!</span>
      <span class="admin-username" *ngIf="isAdminRoute && adminUsername">Ola, {{ adminUsername }}</span>
    </div>

    <nav class="nav" *ngIf="!isAdminRoute">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/produtos" routerLinkActive="active">Produtos</a>

      <div class="contact-menu" [class.open]="contatosOpen" (click)="$event.stopPropagation()">
        <button class="contact-trigger" type="button" (click)="toggleContatos()">
          Contatos
        </button>

        <div class="contact-dropdown" *ngIf="contatosOpen">
            <a
              *ngFor="let social of socialLinks"
              class="contact-item"
              [class]="'contact-item ' + social.name"
              [href]="social.href"
              [attr.aria-label]="social.label"
              [title]="social.label"
              target="_blank"
              rel="noopener noreferrer"
              (click)="closeContatos()"
            >
              <ng-container [ngSwitch]="social.name">
                <svg *ngSwitchCase="'whatsapp'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 3.9A11 11 0 0 0 2.9 17.1L2 22l5-1.3A11 11 0 1 0 20 3.9Zm-8 16.2a9.1 9.1 0 0 1-4.6-1.2l-.3-.2-3 .8.8-2.9-.2-.3A9.2 9.2 0 1 1 12 20.1Zm5.1-6.9c-.3-.1-1.8-.9-2.1-1-.3-.1-.5-.1-.7.1l-.6.8c-.2.2-.3.2-.6.1a7.5 7.5 0 0 1-3.7-3.2c-.2-.3 0-.5.1-.6l.5-.6.2-.5-.1-.5c-.1-.1-.7-1.7-1-2.3-.2-.5-.4-.4-.7-.4h-.6c-.2 0-.5.1-.7.4-.2.3-.9.9-.9 2.1s.9 2.5 1 2.7a10.9 10.9 0 0 0 4.2 4.1c.6.3 1 .5 1.4.6.6.2 1.2.2 1.6.1.5-.1 1.8-.8 2-1.5.3-.7.3-1.3.2-1.4-.1-.1-.3-.2-.6-.3Z" />
                </svg>
                <svg *ngSwitchCase="'instagram'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5Zm0 2.2A2.8 2.8 0 0 0 4.2 7v10A2.8 2.8 0 0 0 7 19.8h10a2.8 2.8 0 0 0 2.8-2.8V7A2.8 2.8 0 0 0 17 4.2H7Zm10.5 1.6a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2.2A2.8 2.8 0 1 0 12 14.8 2.8 2.8 0 0 0 12 9.2Z" />
                </svg>
                <svg *ngSwitchCase="'tiktok'" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14.9 2h2.6a4.8 4.8 0 0 0 4 4.1v2.6a7.2 7.2 0 0 1-4-1.2v6.5a5.9 5.9 0 1 1-5.9-5.9c.4 0 .8 0 1.1.1v2.7a3.2 3.2 0 1 0 2.2 3V2Z" />
                </svg>
              </ng-container>
              <span>{{ social.label }}</span>
            </a>
          </div>
      </div>
    </nav>

    <div class="header-actions" [class.header-actions--guest]="!clientNome" [class.header-actions--logged]="!!clientNome" *ngIf="!isAdminRoute">
      <div class="auth-links" *ngIf="!clientNome">
        <button type="button" class="auth-action" (click)="openClientLogin()">Entrar</button>
      </div>

      <div class="auth-links auth-links--logged" *ngIf="clientNome">
        <div class="client-actions-row">
          <a
            class="cart-menu-link"
            routerLink="/cliente/carrinho"
            routerLinkActive="active"
            aria-label="Abrir carrinho"
            title="Carrinho"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2ZM7.2 14h9.9c.8 0 1.5-.4 1.8-1.1l3.3-6.1a1 1 0 0 0-.9-1.5H6.2L5.3 3.4A1 1 0 0 0 4.3 3H2v2h1.7l3.1 9.5-.9 1.6A2 2 0 0 0 7.6 19H20v-2H7.6l1.1-2Z" />
            </svg>
          </a>
          <a class="client-menu-link" routerLink="/cliente/pedidos" routerLinkActive="active">Meus pedidos</a>
          <button type="button" class="auth-action" (click)="logoutClient()">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer" *ngIf="!isAdminRoute">
    <span>Maris e Laris · Todos os direitos reservados</span>
  </footer>
</div>
