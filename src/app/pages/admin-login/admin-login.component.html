<section class="admin-login-page">
  <div class="login-card">
    <p class="eyebrow">Area administrativa</p>
    <h1>Entrar</h1>
    <p class="lead">Acesse o painel para gerenciar os produtos da colecao.</p>

    <form (ngSubmit)="submit()" class="login-form">
      <label>
        <span>Usuario</span>
        <input [(ngModel)]="username" name="username" type="text" autocomplete="username" />
      </label>

      <label>
        <span>Senha</span>
        <input [(ngModel)]="password" name="password" type="password" autocomplete="current-password" />
      </label>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
