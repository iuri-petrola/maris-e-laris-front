<section class="page">
  <div class="page-header">
    <h1>Colecao</h1>
    <p class="lead">Todas as imagens dos produtos.</p>
  </div>

  <p class="empty" *ngIf="loading">Carregando produtos...</p>
  <p class="empty" *ngIf="!loading && errorMessage">{{ errorMessage }}</p>

  <div class="grid" *ngIf="!loading && !errorMessage && produtos.length > 0; else emptyState">
    <article class="card" *ngFor="let item of produtos">
      <div class="card-body">
        <h3>{{ item.nome }}</h3>
        <p class="price">{{ formatPrice(item.preco) }}</p>
      </div>
      <img [src]="item.imagemUrl" [alt]="item.nome" loading="lazy" />
      <a class="instagram-link" *ngIf="item.videoUrl" [href]="item.videoUrl" target="_blank" rel="noopener noreferrer">
        Ver no Instagram
      </a>
    </article>
  </div>

  <ng-template #emptyState>
    <p class="empty" *ngIf="!loading && !errorMessage">Nenhuma imagem cadastrada.</p>
  </ng-template>
</section>
