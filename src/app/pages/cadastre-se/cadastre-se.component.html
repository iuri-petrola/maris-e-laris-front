<section class="cadastro-page">
  <div class="cadastro-card">
    <p class="eyebrow">Cadastro</p>
    <h1>Cadastre-se</h1>
    <p class="lead">Preencha seus dados para receber novidades e atendimento direto da loja.</p>

    <form class="cadastro-form" (ngSubmit)="submit()">
      <label>
        <span>Nome</span>
        <input [(ngModel)]="nome" name="nome" type="text" autocomplete="name" />
      </label>

      <label>
        <span>E-mail</span>
        <input [(ngModel)]="email" name="email" type="email" autocomplete="email" />
      </label>

      <label>
        <span>WhatsApp</span>
        <input [(ngModel)]="whatsapp" name="whatsapp" type="text" autocomplete="tel" />
      </label>

      <label>
        <span>Senha</span>
        <input [(ngModel)]="senha" name="senha" type="password" autocomplete="new-password" />
      </label>

      <label>
        <span>Confirmar senha</span>
        <input [(ngModel)]="confirmarSenha" name="confirmarSenha" type="password" autocomplete="new-password" />
      </label>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Cadastrando...' : 'Criar cadastro' }}
      </button>
    </form>
  </div>
</section>
