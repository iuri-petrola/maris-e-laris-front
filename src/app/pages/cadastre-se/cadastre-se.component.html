<section class="cadastro-page">
  <div class="cadastro-backdrop"></div>

  <div class="cadastro-modal">
    <p class="eyebrow">Cadastro rapido</p>
    <h1>Cadastre-se</h1>
    <p class="lead">Informe seu nome e a melhor forma de contato para continuar comprando.</p>

    <form class="cadastro-form" (ngSubmit)="submit()">
      <label>
        <span>Nome</span>
        <input [(ngModel)]="nome" name="nome" type="text" autocomplete="name" />
      </label>

      <div class="contact-type">
        <span>Contato</span>
        <div class="contact-type-buttons">
          <button type="button" [class.active]="contactType === 'Whats'" (click)="setContactType('Whats')">Whats</button>
          <button type="button" [class.active]="contactType === 'Insta'" (click)="setContactType('Insta')">Insta</button>
          <button type="button" [class.active]="contactType === 'TikTok'" (click)="setContactType('TikTok')">TikTok</button>
        </div>
      </div>

      <label>
        <span>Contato</span>
        <input
          [(ngModel)]="contato"
          (ngModelChange)="normalizeContatoInput()"
          name="contato"
          type="text"
          [placeholder]="contatoPlaceholder"
          autocomplete="off"
        />
      </label>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Enviando...' : 'Continuar' }}
      </button>
    </form>
  </div>
</section>
