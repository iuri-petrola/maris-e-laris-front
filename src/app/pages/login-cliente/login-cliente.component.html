<section class="client-login-page">
  <div class="login-card">
    <p class="eyebrow">Area do cliente</p>
    <h1>Entrar</h1>
    <p class="lead">Acesse com seu nome e senha.</p>

    <form (ngSubmit)="submit()" class="login-form">
      <label>
        <span>Nome</span>
        <input [(ngModel)]="nome" name="nome" type="text" autocomplete="username" />
      </label>

      <label>
        <span>Senha</span>
        <input [(ngModel)]="password" name="password" type="password" autocomplete="current-password" />
      </label>

      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

      <p class="signup-hint">
        Nao possui uma conta? <a routerLink="/cadastre-se">Cadastre-se</a>
      </p>
    </form>
  </div>
</section>
