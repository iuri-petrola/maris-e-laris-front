<section class="cliente-area-page">
  <div class="cliente-area-card">
    <div class="cliente-area-header">
      <div>
        <p class="eyebrow">Area do cliente</p>
        <h1>Minha conta</h1>
      </div>
      <button type="button" class="logout-btn" (click)="logout()">Sair</button>
    </div>

    <p class="status" *ngIf="loading">Carregando seus dados...</p>
    <p class="error" *ngIf="!loading && errorMessage">{{ errorMessage }}</p>

    <div class="profile-grid" *ngIf="!loading && profile">
      <article class="profile-item">
        <span class="label">Nome</span>
        <strong>{{ profile.nome }}</strong>
      </article>

      <article class="profile-item">
        <span class="label">E-mail</span>
        <strong>{{ profile.email }}</strong>
      </article>

      <article class="profile-item">
        <span class="label">WhatsApp</span>
        <strong>{{ profile.whatsapp }}</strong>
      </article>

      <article class="profile-item">
        <span class="label">Cadastro</span>
        <strong>{{ profile.createdAt | date: 'dd/MM/yyyy' }}</strong>
      </article>
    </div>
  </div>
</section>
