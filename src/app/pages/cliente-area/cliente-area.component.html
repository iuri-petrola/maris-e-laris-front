<section class="cliente-area-page">
  <div class="success-popup-backdrop" *ngIf="successPopupMessage">
    <div class="success-popup" role="alertdialog" aria-modal="true" aria-live="assertive">
      <div class="success-popup-icon">✓</div>
      <p>{{ successPopupMessage }}</p>
      <button type="button" class="success-popup-btn" (click)="closeSuccessPopup()">Ir para o carrinho</button>
    </div>
  </div>

  <div class="cliente-area-card">
    <div class="cliente-area-header">
      <div>
        <p class="eyebrow">Area do cliente</p>
        <h1>Minha conta</h1>
      </div>
      <button type="button" class="logout-btn" (click)="logout()">Sair</button>
    </div>

    <p class="status" *ngIf="loading">Carregando seus dados...</p>
    <p class="error" *ngIf="!loading && errorMessage">{{ errorMessage }}</p>

    <section class="produtos-panel" *ngIf="!loading && !errorMessage">
      <div class="section-title">
        <h2>Produtos</h2>
        <p>Adicione itens ao seu carrinho.</p>
      </div>

      <p class="cart-message" *ngIf="cartMessage">{{ cartMessage }}</p>

      <div class="produtos-grid">
        <article class="produto-card" *ngFor="let produto of produtos">
          <img [src]="produto.imagemUrl" [alt]="produto.nome" loading="lazy" />
          <div class="produto-card-body">
            <strong>{{ produto.nome }}</strong>
            <span>{{ formatPrice(produto.preco) }}</span>
          </div>
          <button type="button" class="cart-btn" (click)="addToCart(produto)" [disabled]="cartLoading">
            Adicionar ao carrinho
          </button>
        </article>
      </div>
    </section>
  </div>
</section>
